# Hermes Workspace — Hardened Fork (khaledaziz-ag)
#
# Runtime patches close reliability gaps vs native kanban:
#   - Patch F: no false-block on sync checkpoint timeout + late reconcile
#   - Checkpoint: last-seen checkpoint wins (TUI gutter tolerance)
#   - TUI paste: trailing decoration handling
#   - Disk-cleanup: protect bench/ from auto-delete
#   - Entrypoint: tmux install + per-seat CLI wrapper generation
#
# All patches are marker-guarded, idempotent, survive pull_policy:always.
#
# Quick Start:
#   1. cp .env.example .env && edit
#   2. node docker/patches/install-workspace-patches.js  (copies scripts to /opt/hermes-cli)
#   3. docker compose up -d

services:
  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        T_UID="$${HERMES_UID:-10010}"
        T_GID="$${HERMES_GID:-999}"
        chown "$${T_UID}:$${T_GID}" /app
        mkdir -p /app/runtime /app/.runtime
        chown -R "$${T_UID}:$${T_GID}" /app/runtime /app/.runtime /app/skills

        # --- swarm worker support ---
        if ! command -v tmux >/dev/null 2>&1; then
          (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tmux) >/dev/null 2>&1 || true
        fi
        if [ ! -e /opt/data ]; then
          ln -sfn /home/workspace/.hermes /opt/data 2>/dev/null || true
        fi
        if [ -x /usr/bin/tmux ]; then
          for p in /opt/homebrew/bin /usr/local/bin; do
            mkdir -p "$$p" 2>/dev/null || true
            ln -sf /usr/bin/tmux "$$p/tmux" 2>/dev/null || true
          done
        fi
        mkdir -p /home/workspace/.local/bin
        for d in /home/workspace/.hermes/profiles/*/; do
          [ -d "$$d" ] || continue
          wid=$$(basename "$$d")
          case "$$wid" in
            *[!a-zA-Z0-9_-]*|) continue ;;
          esac
          printf #!/bin/bashncd %snexport HERMES_PROFILE=%snexport HERMES_CLI_BIN=%snexec %s chat --profile %sn \
            "/home/workspace/.hermes/profiles/9188{wid}" "9188{wid}" "/opt/hermes-cli/venv/bin/hermes" \
            "/opt/hermes-cli/venv/bin/hermes" "9188{wid}" > "/home/workspace/.local/bin/$${wid}"
          chmod 755 "/home/workspace/.local/bin/$${wid}"
        done
        chown -R "$${T_UID}:$${T_GID}" /home/workspace/.local

        # --- apply runtime patches (idempotent, marker-guarded) ---
        node /opt/hermes-cli/patch-swarm-checkpoint.js /app/dist/server/assets/router-*.js 2>&1 | tail -3 || true
        node /opt/hermes-cli/patch-swarm-dispatch.js /app/dist/server/assets/router-*.js 2>&1 | tail -3 || true
        node /opt/hermes-cli/patch-tui-paste.js /opt/hermes-cli/venv/lib/python3.11/site-packages/hermes_cli/tui_dist/entry.js 2>&1 | tail -2 || true
        python3 /opt/hermes-cli/patch-disk-cleanup.py 2>&1 | tail -2 || true

        mkdir -p /home/workspace/handoffs && chown "$${T_UID}:$${T_GID}" /home/workspace/handoffs 2>/dev/null || true
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint.sh "$$@"
      - /usr/local/bin/docker-entrypoint.sh
    command: ["node", "--max-old-space-size=2048", "server-entry.js"]
    env_file:
      - .env
    environment:
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://hermes:8642
      HERMES_DASHBOARD_URL: http://hermes:9119
      HERMES_API_TOKEN: $${API_SERVER_KEY:-}
      HERMES_PASSWORD: $${HERMES_PASSWORD:-$${CLAUDE_PASSWORD:-}}
      COOKIE_SECURE: $${COOKIE_SECURE:-}
      TRUST_PROXY: $${TRUST_PROXY:-}
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_CLI_BIN: /opt/hermes-cli/venv/bin/hermes
      HERMES_CLI_PATH: /opt/hermes-cli/venv/bin/hermes
      TMUX_BIN: /usr/bin/tmux
      HERMES_TMUX_BIN: /usr/bin/tmux
    volumes:
      - hermes-agent-data:/home/workspace/.hermes
      - hermes-workspace-files:/workspace
    ports:
      - 0.0.0.0:3000:3000

volumes:
  hermes-agent-data:
  hermes-workspace-files:
